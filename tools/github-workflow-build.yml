name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        run: |
          VERSION=$(grep -E '^VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "构建版本：$VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/yutian-panel.apk
          ls -lh dist/yutian-panel.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yutian-panel-${{ env.VERSION }}
          path: dist/yutian-panel.apk
          retention-days: 30

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: 雨天面板 v${{ env.VERSION }}
          body: |
            雨天面板 v${{ env.VERSION }}

            从 GitHub 在线拉取极核面板 H5，APK 只保留原生壳。
          files: dist/yutian-panel.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
