<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>骑行轨迹</title>
<style>
  :root{
    --bg:#0a0a0c; --card:#15151c; --line:#262631; --text:#ededf2;
    --muted:#9a9aa6; --accent:#8b7cff; --green:#43d18b; --red:#ff6b7a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","MiSans",sans-serif}
  body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  #app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
  header h1{font-size:18px;margin:0;flex:1;font-weight:600;letter-spacing:.02em}
  .iconbtn{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;
    background:var(--card);color:var(--text);font-size:18px;line-height:1;display:grid;place-items:center}
  .iconbtn:active{transform:scale(.94)}
  .month{display:flex;align-items:center;justify-content:center;gap:18px;padding:6px 16px 12px}
  .month button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);color:var(--text);font-size:18px}
  #monthLabel{font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:.06em;color:var(--muted)}
  #summary{display:flex;gap:8px;padding:0 16px 12px;flex-wrap:wrap}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:8px 12px;font-size:12px;color:var(--muted)}
  .chip b{display:block;font-size:17px;color:var(--text);margin-top:2px;font-variant-numeric:tabular-nums}
  #status{padding:0 16px;color:var(--muted);font-size:12px;min-height:18px}
  .mapwrap{margin:10px 16px 0;border-radius:16px;overflow:hidden;border:1px solid var(--line);
    background:linear-gradient(160deg,#111118,#0b0b10);position:relative;height:248px}
  #map{width:100%;height:100%;display:block}
  #mapEmpty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px}
  #detail{padding:10px 16px 0;font-size:12px;color:var(--muted);min-height:34px}
  #detail b{color:var(--text);font-weight:500}
  #list{padding:6px 16px 28px;display:flex;flex-direction:column;gap:8px}
  .ride{width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;
    background:var(--card);color:var(--text);padding:10px 12px;display:flex;flex-direction:column;gap:3px}
  .ride.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .ride .row1{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
  .ride .time{font-size:13px}
  .ride .km{color:var(--muted);font-size:12px}
  .ride .route{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{padding:18px;text-align:center;color:var(--muted);font-size:12px}
  .primary{border:1px solid var(--accent);background:transparent;color:var(--accent);
    border-radius:12px;padding:10px 16px;font-size:13px;margin-top:12px}
  #vehicleWrap{padding:0 16px 8px;display:none;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  select{flex:1;background:var(--card);color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:7px 10px;font-size:13px}
  .notice{margin:24px 16px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
  .notice p{margin:0 0 6px;color:var(--muted);font-size:13px}
  .notice strong{color:var(--text);font-size:15px;display:block;margin-bottom:6px}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="iconbtn" id="closeBtn" aria-label="关闭">×</button>
    <h1>骑行轨迹</h1>
    <button class="iconbtn" id="refreshBtn" aria-label="刷新">↻</button>
  </header>
  <div class="month">
    <button id="prevBtn" aria-label="上个月">‹</button>
    <span id="monthLabel"></span>
    <button id="nextBtn" aria-label="下个月">›</button>
  </div>
  <div id="summary"></div>
  <div id="vehicleWrap"><span>车辆</span><select id="vehicle"></select></div>
  <div id="status"></div>
  <div class="mapwrap">
    <canvas id="map"></canvas>
    <div id="mapEmpty">选择一条行程查看轨迹</div>
  </div>
  <div id="detail"></div>
  <div id="list"></div>
</div>
<script>
(function(){
  'use strict';
  var bridge = window.ZeehoRides;
  var state = { token:'', vin:'', month:'', days:[], rides:[], selected:null, vehicles:[] };
  var el = function(id){ return document.getElementById(id); };
  var monthEl=el('monthLabel'), statusEl=el('status'), listEl=el('list'),
      summaryEl=el('summary'), detailEl=el('detail'), canvas=el('map'),
      mapEmpty=el('mapEmpty'), vehicleWrap=el('vehicleWrap'), vehicleSel=el('vehicle');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  function pad(n){ return String(n).padStart(2,'0'); }
  function monthNow(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
  function shiftMonth(m, delta){
    var parts=m.split('-'), d=new Date(Number(parts[0]), Number(parts[1])-1+delta, 1);
    return d.getFullYear()+'-'+pad(d.getMonth()+1);
  }
  function enc(s){ return encodeURIComponent(String(s==null?'':s)); }
  function text(v){ return v==null?'':String(v); }
  function num(v){ var n=Number(v); return isFinite(n)?n:0; }
  function addr(v){
    if(!v) return '';
    try{ var o=JSON.parse(v); return text(o.name||o.address||''); }catch(e){ return text(v); }
  }
  function readToken(){
    var t='';
    try{ if(bridge && bridge.token) t=bridge.token()||''; }catch(e){}
    if(!t){ try{ t=localStorage.getItem('zeeho.token')||''; }catch(e){} }
    return t.trim();
  }
  function signBody(){
    if(!bridge || !bridge.sign) throw new Error('bridge_missing');
    return JSON.parse(bridge.sign('{}'));
  }
  async function api(path){
    var sg=signBody();
    var res=await fetch('https://tapi.zeehoev.com'+path,{
      headers:{
        'Authorization':'Bearer '+state.token,
        'interfaceversion':'2',
        'cfmoto-x-param':sg.param,
        'cfmoto-x-sign':sg.sign,
        'cfmoto-x-sign-type':'0'
      }
    });
    var body=await res.json().catch(function(){ return {}; });
    if(!res.ok) throw new Error('HTTP '+res.status);
    if(body && body.code && String(body.code)!=='10000') throw new Error(body.message||('code '+body.code));
    return body;
  }

  function showNotice(title, message, actionLabel, action){
    listEl.innerHTML='';
    var box=document.createElement('div'); box.className='notice';
    var strong=document.createElement('strong'); strong.textContent=title;
    var p=document.createElement('p'); p.textContent=message;
    box.appendChild(strong); box.appendChild(p);
    if(actionLabel){
      var b=document.createElement('button'); b.className='primary'; b.textContent=actionLabel;
      b.addEventListener('click', action); box.appendChild(b);
    }
    listEl.appendChild(box);
    statusEl.textContent=''; mapEmpty.style.display='grid';
    summaryEl.innerHTML=''; detailEl.innerHTML='';
  }

  function renderSummary(){
    var km=0, count=state.rides.length, minutes=0;
    state.rides.forEach(function(r){ km+=num(r.rideMileage); minutes+=num(r.ridingTimeUnitMinute); });
    summaryEl.innerHTML=
      '<div class="chip">行程<b>'+count+'</b></div>'+
      '<div class="chip">里程<b>'+km.toFixed(1)+' km</b></div>'+
      '<div class="chip">时长<b>'+minutes+' 分</b></div>';
  }

  function renderVehicles(){
    vehicleWrap.style.display=state.vehicles.length>1?'flex':'none';
    vehicleSel.innerHTML='';
    state.vehicles.forEach(function(v){
      var o=document.createElement('option');
      o.value=v.vinNo||'';
      o.textContent=(v.vehicleName||v.vinNo||'')+(v.licensePlate?' · '+v.licensePlate:'');
      vehicleSel.appendChild(o);
    });
    vehicleSel.value=state.vin;
  }

  function renderList(){
    listEl.innerHTML='';
    if(!state.rides.length){
      var d=document.createElement('div'); d.className='empty';
      d.textContent='这个月没有骑行记录'; listEl.appendChild(d); return;
    }
    state.rides.forEach(function(r, i){
      var b=document.createElement('button');
      b.className='ride'+(state.selected===r?' sel':'');
      var row1=document.createElement('div'); row1.className='row1';
      var t=document.createElement('span'); t.className='time'; t.textContent=text(r.start||r.day).slice(5,16);
      var k=document.createElement('span'); k.className='km';
      k.textContent=num(r.rideMileage).toFixed(1)+' km · '+num(r.ridingTimeUnitMinute)+' 分';
      row1.appendChild(t); row1.appendChild(k);
      var route=document.createElement('div'); route.className='route';
      route.textContent=(addr(r.startAddr)||'起点')+' → '+(addr(r.endAddr)||'终点');
      b.appendChild(row1); b.appendChild(route);
      b.addEventListener('click', function(){ selectRide(r); });
      listEl.appendChild(b);
    });
    var selected=state.selected;
    if(selected){ var idx=state.rides.indexOf(selected); if(idx>=0){
      var children=listEl.querySelectorAll('.ride'); if(children[idx]) children[idx].classList.add('sel');
    }}
  }

  function parseTrajectory(raw){
    var out=[];
    text(raw).split('&').forEach(function(seg){
      var p=seg.split(',');
      if(p.length<2) return;
      var lng=Number(p[0]), lat=Number(p[1]);
      if(!isFinite(lng)||!isFinite(lat)) return;
      out.push({lng:lng,lat:lat,speed:num(p[2]),ts:num(p[3]),dist:num(p[4])});
    });
    return out;
  }

  function draw(ride){
    var w=canvas.clientWidth||320, h=canvas.clientHeight||248;
    canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
    var ctx=canvas.getContext('2d');
    if(!ctx) return;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    var bg=ctx.createLinearGradient(0,0,0,h);
    bg.addColorStop(0,'#12121a'); bg.addColorStop(1,'#0b0b10');
    ctx.fillStyle=bg; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='rgba(255,255,255,.045)'; ctx.lineWidth=1;
    for(var x=0;x<w;x+=28){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
    for(var y=0;y<h;y+=28){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }

    var points=parseTrajectory(ride&&ride.trajectory);
    if(points.length<2){ mapEmpty.style.display='grid'; mapEmpty.textContent='这条行程没有轨迹点'; return; }
    mapEmpty.style.display='none';
    var minLng=Infinity,maxLng=-Infinity,minLat=Infinity,maxLat=-Infinity;
    points.forEach(function(p){
      if(p.lng<minLng)minLng=p.lng; if(p.lng>maxLng)maxLng=p.lng;
      if(p.lat<minLat)minLat=p.lat; if(p.lat>maxLat)maxLat=p.lat;
    });
    var spanLng=Math.max(maxLng-minLng,1e-6), spanLat=Math.max(maxLat-minLat,1e-6);
    var padX=30, padY=30;
    var scale=Math.min((w-padX*2)/spanLng,(h-padY*2)/spanLat);
    var offX=(w-spanLng*scale)/2, offY=(h-spanLat*scale)/2;
    function px(p){ return {x:offX+(p.lng-minLng)*scale, y:h-(offY+(p.lat-minLat)*scale)}; }

    ctx.save();
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle='rgba(139,124,255,.22)'; ctx.lineWidth=10;
    ctx.beginPath();
    points.forEach(function(p,i){ var q=px(p); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); });
    ctx.stroke();
    var grad=ctx.createLinearGradient(0,0,w,0);
    grad.addColorStop(0,'#8b7cff'); grad.addColorStop(1,'#43d18b');
    ctx.strokeStyle=grad; ctx.lineWidth=3;
    ctx.beginPath();
    points.forEach(function(p,i){ var q=px(p); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); });
    ctx.stroke();
    ctx.restore();

    function dot(p,color,label){
      var q=px(p);
      ctx.beginPath(); ctx.arc(q.x,q.y,7,0,Math.PI*2);
      ctx.fillStyle=color; ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=2; ctx.stroke();
      if(label){ ctx.fillStyle='#fff'; ctx.font='11px sans-serif'; ctx.textAlign='center';
        ctx.fillText(label,q.x,q.y-12); }
    }
    dot(points[0],'#43d18b','起');
    dot(points[points.length-1],'#ff6b7a','终');

    var last=points[points.length-1];
    ctx.fillStyle='rgba(255,255,255,.72)'; ctx.font='11px sans-serif'; ctx.textAlign='left';
    ctx.fillText(points.length+' 个点 · 最高 '+Math.round(num(ride.maxSpeed))+' km/h',12,h-12);
  }

  function selectRide(ride){
    state.selected=ride;
    renderList();
    draw(ride);
    detailEl.innerHTML='起点 <b>'+ (addr(ride.startAddr)||'—') +'</b><br>'+
      '终点 <b>'+ (addr(ride.endAddr)||'—') +'</b><br>'+
      '时间 <b>'+ text(ride.startTime) +'</b> · 最高 <b>'+num(ride.maxSpeed)+' km/h</b>'+
      ' · 里程 <b>'+num(ride.rideMileage).toFixed(1)+' km</b>';
  }

  async function loadMonth(){
    if(!state.vin) return;
    statusEl.textContent='正在读取 '+state.month+' …';
    try{
      var path='/v1.0/app/cfmotoserverapp/ridetrack_v2?vinNo='+enc(state.vin)+
        '&page=1&pageSize=31&startTime='+enc(state.month)+
        '&startDateTime=&startDate=&endDate=';
      var data=await api(path);
      state.days=Array.isArray(data.data)?data.data:[];
      state.rides=[];
      state.days.forEach(function(day){
        (day.historyList||[]).forEach(function(r){
          r.day=day.dayTime||'';
          state.rides.push(r);
        });
      });
      state.rides.sort(function(a,b){ return text(b.start).localeCompare(text(a.start)); });
      renderSummary();
      state.selected=state.rides[0]||null;
      renderList();
      if(state.selected){ selectRide(state.selected); } else { mapEmpty.style.display='grid';
        mapEmpty.textContent='这个月没有轨迹'; detailEl.innerHTML=''; }
      statusEl.textContent=state.rides.length?('共 '+state.rides.length+' 次行程'):'';
    }catch(e){
      statusEl.textContent='加载失败：'+(e&&e.message?e.message:'网络错误');
      state.rides=[]; renderSummary(); renderList(); mapEmpty.style.display='grid';
      mapEmpty.textContent='加载失败';
    }
  }

  async function loadVehicles(){
    statusEl.textContent='正在读取车辆…';
    try{
      var data=await api('/v1.0/app/cfmotoserverapp/vehicle/list');
      state.vehicles=Array.isArray(data.data)?data.data:[];
      if(!state.vehicles.length){ showNotice('没有绑定车辆','请先在面板里绑定车辆，再回来看轨迹。'); return; }
      state.vin=state.vehicles[0].vinNo||'';
      renderVehicles();
      await loadMonth();
    }catch(e){
      showNotice('读取失败', e&&e.message?e.message:'网络错误', '重试', function(){ loadVehicles(); });
    }
  }

  function boot(){
    state.month=monthNow();
    monthEl.textContent=state.month;
    state.token=readToken();
    if(!state.token){
      showNotice('还没有登录','请先返回面板登录，再点右上角的「轨迹」。','返回面板',function(){
        try{ bridge && bridge.close && bridge.close(); }catch(e){}
      });
      return;
    }
    loadVehicles();
  }

  el('closeBtn').addEventListener('click', function(){ try{ bridge && bridge.close && bridge.close(); }catch(e){} });
  el('refreshBtn').addEventListener('click', function(){ if(state.token) loadMonth(); });
  el('prevBtn').addEventListener('click', function(){ state.month=shiftMonth(state.month,-1); monthEl.textContent=state.month; loadMonth(); });
  el('nextBtn').addEventListener('click', function(){ state.month=shiftMonth(state.month,1); monthEl.textContent=state.month; loadMonth(); });
  vehicleSel.addEventListener('change', function(){ state.vin=vehicleSel.value; loadMonth(); });
  window.addEventListener('resize', function(){ if(state.selected) draw(state.selected); });

  if(!bridge){ showNotice('请在 App 内打开','这个页面需要「雨天面板」的原生桥。'); return; }
  boot();
})();
</script>
</body>
</html>
