apply plugin: 'com.android.application'

android {
    namespace 'com.yutian.panel'
    compileSdk 33

    defaultConfig {
        applicationId project.property('APP_PACKAGE')
        minSdk 26
        targetSdk 33
        versionCode project.property('VERSION_CODE').toInteger()
        versionName project.property('VERSION_NAME')

        buildConfigField "String", "GH_OWNER", "\"${project.property('GH_OWNER')}\""
        buildConfigField "String", "GH_REPO", "\"${project.property('GH_REPO')}\""
    }

    signingConfigs {
        release {
            storeFile file(project.property('KEYSTORE_FILE'))
            storePassword project.property('KEYSTORE_PASSWORD')
            keyAlias project.property('KEY_ALIAS')
            keyPassword project.property('KEY_PASSWORD')
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        jniLibs.useLegacyPackaging false
    }

    // H5 资源已经是压缩过的 glb / webp，再压一遍只会拖慢构建、拖慢首次加载
    aaptOptions {
        noCompress 'glb', 'webp', 'png'
    }
}

dependencies {
    // 刻意不引入 AndroidX：整个壳只依赖系统 API，构建更快、体积更小
}
